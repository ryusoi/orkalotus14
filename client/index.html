<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="theme-color" content="#0d2a3b" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('orka_lotus_theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var i = 0; i < keys.length; i++) {
              caches.delete(keys[i]);
            }
          });
        }
      })();
    </script>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/images/orka-logo-inside.png" />
    <meta name="description" content="ORKA LOTUS BEACH HOTEL — Guest Experience Ranking &amp; Hospitality Feedback System" />
    <meta property="og:title" content="Remix orkalotus14" />
    <meta property="og:description" content="ORKA LOTUS BEACH HOTEL — Guest Experience Ranking &amp; Hospitality Feedback System" />
    <title>Remix orkalotus14</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&family=Pinyon+Script&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
